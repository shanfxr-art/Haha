name: PC app release

# Packages the pc-app folder as Jarvis-PC-v<version>-build<N>.zip (+ .sha256) and publishes it as a release.
# The VM's master script downloads the newest one. It never becomes the "latest" release, so the phone
# app's update check keeps seeing the Android release.
on:
  workflow_dispatch:
  push:
    paths:
      - 'pc-app/**'
      - '.github/workflows/pc-release.yml'

permissions:
  contents: write

concurrency:
  group: pc-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check and package
        id: pkg
        run: |
          set -euo pipefail
          # Syntax-check every Python file in the app (not just three), so a typo anywhere stops the release.
          find pc-app -name '*.py' -not -path '*/__pycache__/*' -print0 | xargs -0 python3 -m py_compile
          # VERSION lives in jcore.py (there is no core.py: core/ is a package).
          VN=$(grep -oP '^VERSION\s*=\s*"\K[^"]+' pc-app/jcore.py | head -n 1 || true)
          test -n "$VN" || { echo "VERSION not found in pc-app/jcore.py"; exit 1; }
          NAME="Jarvis-PC-v${VN}-build${GITHUB_RUN_NUMBER}.zip"
          mkdir -p dist
          (cd pc-app && find . -name '__pycache__' -prune -o -type f ! -name '*.pyc' ! -name 'test_*' -print | zip -q "../dist/$NAME" -@)
          unzip -tq "dist/$NAME"
          (cd dist && sha256sum "$NAME" > "$NAME.sha256")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "vn=$VN" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pc-${{ github.run_number }}
          name: J.A.R.V.I.S. PC v${{ steps.pkg.outputs.vn }} (build ${{ github.run_number }})
          body: PC app for the Windows VM. The VM downloads this automatically.
          files: |
            dist/*.zip
            dist/*.sha256
          fail_on_unmatched_files: true
          make_latest: false
